name: Setup Environment
description: Setup Node.js and cache npm packages (not node_modules) consistently
# Note: Compatible with runs-on: ubuntu-24.04 or ubuntu-slim.
# Jobs that need a real browser (Cypress/Playwright) should stay on ubuntu-24.04.
runs:
  using: "composite"
  steps:
    - name: Show Node.js environment info
      shell: bash
      run: |
        echo "=== Pre-installed Node.js versions ==="
        ls -la /opt/hostedtoolcache/node/ 2>/dev/null || ls -la /opt/acttoolcache/node/ 2>/dev/null || echo "No pre-installed Node versions found"
        echo "=== Current default Node.js ==="
        which node && node --version || echo "No default Node.js found"
        echo "=== .nvmrc content ==="
        cat .nvmrc 2>/dev/null || echo "No .nvmrc file found"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Enable Corepack and activate pinned npm version
      shell: bash
      run: |
        corepack enable npm
        corepack install
    - name: Verify npm version
      shell: bash
      run: |
        echo "=== Verifying npm version (npm >=9.5.0 required for provenance) ==="
        npm --version
    - name: Show final Node.js version
      shell: bash
      run: |
        echo "=== Final Node.js version after setup ==="
        which node && node --version
        npm --version
