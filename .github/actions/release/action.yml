name: Release job
description: build affected packages and publish them to npm
inputs:
  gh_token:
    description: 'Github token'
    required: true
  gh_name:
    description: 'Github name'
    required: true
  gh_email:
    description: 'Github email'
    required: true
  gpg_private_key:
    description: 'GPG private key for signing commits (passphrase-less)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Fast-forward to latest master
      shell: bash
      # Checkout is pinned to github.sha. Advance before setup and npm ci so dependencies match
      # the current commit. Both verify-versions.sh and nx release use --merged HEAD for tag
      # resolution; no release commit exists yet, so only a fast-forward is allowed.
      run: |
        git fetch origin master
        git merge --ff-only origin/master
    - uses: './.github/actions/setup-environment'
    - name: Install deps
      shell: bash
      run: npm ci
    - name: Import GPG key
      shell: bash
      run: |
        echo "${{ inputs.gpg_private_key }}" | base64 -d | gpg --batch --import
    - name: git config
      shell: bash
      run: |
        git config user.name "${{ inputs.gh_name }}"
        git config user.email "${{ inputs.gh_email }}"
        git config commit.gpgsign true
        git config tag.gpgsign true
        git config user.signingkey $(gpg --list-secret-keys --with-colons "${{ inputs.gh_email }}" | awk -F: '/^sec:/ {print $5; exit}')
    - name: Verify version consistency
      shell: bash
      run: bash .github/scripts/verify-versions.sh
    - name: Release
      shell: bash
      # Skip publish to avoid orphaned npm versions if push fails.
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        GITHUB_TOKEN: ${{ inputs.gh_token }}
        # Disable legacy peer deps to ensure proper dependency resolution
        # See: https://github.com/nrwl/nx/issues/22066#issuecomment-2576366862
        # See: https://github.com/nrwl/nx/blob/5ea2e47acfa9d175546daa922ce40905533f1074/packages/nx/src/utils/package-manager.ts#L207-L213
        npm_config_legacy_peer_deps: false
        # https://docs.npmjs.com/generating-provenance-statements#using-third-party-package-publishing-tools
        # https://philna.sh/blog/2026/01/28/trusted-publishing-npm/
        NPM_CONFIG_PROVENANCE: true
      run: npx nx release --skip-publish
    - name: Push release commit and tags
      shell: bash
      # nx release creates a release commit and tags locally. Treat that commit as immutable:
      # rebasing it can leave signed tags pointing at its old hash. If master advanced during
      # release calculation, this atomic push fails and the attempt must be restarted from master.
      # --follow-tags pushes annotated release tags; --atomic prevents a commit-only push.
      # HUSKY=0 disables pre-push hooks in CI — tests are run separately by the CI pipeline.
      env:
        HUSKY: '0'
      run: git push --atomic --follow-tags origin HEAD:master
    - name: Publish to npm
      shell: bash
      # Publish only after push succeeds to prevent orphaned npm versions.
      # If push failed, re-running this job is safe — no npm versions published yet.
      # https://docs.npmjs.com/generating-provenance-statements#using-third-party-package-publishing-tools
      # https://philna.sh/blog/2026/01/28/trusted-publishing-npm/
      env:
        NPM_CONFIG_PROVENANCE: true
      run: npx nx release publish
